name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset vs2022-x64 --fresh

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/package_portable.ps1

      - name: Build MSIX
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_msix.ps1

      - name: Verify packages
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/verify_packages.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UEdit-win64
          path: |
            dist/UEdit-*.zip
            dist/UEdit_*.msix

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/UEdit-*.zip dist/UEdit_*.msix --title "UEdit ${{ github.ref_name }}" --generate-notes
